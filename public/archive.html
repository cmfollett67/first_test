<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="theme.js"></script>
  <script src="overlay.js"></script>
  <nav>
    <a href="search.html">Search</a>
    <a href="upload.html">Upload</a>
    <a href="archive.html" class="active">Archive</a>
    <div class="theme-toggle">
      <span class="theme-label">Light</span>
      <button id="theme-toggle" class="toggle-switch" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
      <span class="theme-label">Dark</span>
    </div>
  </nav>

  <main>
    <h1>Archive</h1>

    <div class="archive-controls">
      <div class="view-toggle">
        <button id="btn-thumbnail" class="toggle-btn active" title="Thumbnail view">Thumbnails</button>
        <button id="btn-list" class="toggle-btn" title="List view">List</button>
      </div>
      <div class="sort-controls">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="alpha-asc">Name A-Z</option>
          <option value="alpha-desc">Name Z-A</option>
          <option value="images-first">Images first</option>
          <option value="videos-first">Videos first</option>
        </select>
      </div>
    </div>

    <div id="archive"></div>
  </main>

  <!-- Edit Tags Modal -->
  <div id="edit-modal" class="edit-modal hidden">
    <div class="edit-modal-backdrop"></div>
    <div class="edit-modal-content">
      <h2>Edit Tags</h2>
      <input type="hidden" id="edit-filename">
      <div class="form-group">
        <label for="edit-tags">Tags (comma-separated)</label>
        <input type="text" id="edit-tags" placeholder="e.g. sunset, beach, vacation">
      </div>
      <div class="edit-modal-actions">
        <button type="button" id="edit-cancel" class="btn-secondary">Cancel</button>
        <button type="button" id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    const archiveEl = document.getElementById('archive');
    const btnThumbnail = document.getElementById('btn-thumbnail');
    const btnList = document.getElementById('btn-list');
    const sortSelect = document.getElementById('sort-select');

    let photos = [];
    let viewMode = 'thumbnail';

    async function loadPhotos() {
      archiveEl.innerHTML = '<p class="loading">Loading...</p>';
      try {
        const res = await fetch('/api/all');
        const data = await res.json();
        photos = data.results;
        render();
      } catch (err) {
        archiveEl.innerHTML = '<p class="error">Failed to load photos. Is the server running?</p>';
      }
    }

    function sortPhotos(list) {
      const sorted = [...list];
      const mode = sortSelect.value;
      switch (mode) {
        case 'newest':
          sorted.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
          break;
        case 'oldest':
          sorted.sort((a, b) => new Date(a.uploadedAt) - new Date(b.uploadedAt));
          break;
        case 'alpha-asc':
          sorted.sort((a, b) => a.originalName.localeCompare(b.originalName));
          break;
        case 'alpha-desc':
          sorted.sort((a, b) => b.originalName.localeCompare(a.originalName));
          break;
        case 'images-first':
          sorted.sort((a, b) => {
            const aType = a.mediaType || 'image';
            const bType = b.mediaType || 'image';
            if (aType === bType) return new Date(b.uploadedAt) - new Date(a.uploadedAt);
            return aType === 'image' ? -1 : 1;
          });
          break;
        case 'videos-first':
          sorted.sort((a, b) => {
            const aType = a.mediaType || 'image';
            const bType = b.mediaType || 'image';
            if (aType === bType) return new Date(b.uploadedAt) - new Date(a.uploadedAt);
            return aType === 'video' ? -1 : 1;
          });
          break;
      }
      return sorted;
    }

    function render() {
      if (photos.length === 0) {
        archiveEl.innerHTML = '<p class="no-results">No files in the archive yet.</p>';
        return;
      }

      const sorted = sortPhotos(photos);
      archiveEl.innerHTML = '';

      if (viewMode === 'thumbnail') {
        renderThumbnailView(sorted);
      } else {
        renderListView(sorted);
      }
    }

    function renderThumbnailView(items) {
      const grid = document.createElement('div');
      grid.className = 'photo-grid';

      items.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.dataset.filename = entry.filename;
        const isVideo = entry.mediaType === 'video';
        const src = `/uploads/${entry.filename}`;

        if (isVideo) {
          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'video-thumb';

          const video = document.createElement('video');
          video.src = src;
          video.muted = true;
          video.preload = 'metadata';

          const playIcon = document.createElement('div');
          playIcon.className = 'play-icon';
          playIcon.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

          thumbWrap.appendChild(video);
          thumbWrap.appendChild(playIcon);
          thumbWrap.addEventListener('click', () => window.openVideoOverlay(src));
          card.appendChild(thumbWrap);
        } else {
          const img = document.createElement('img');
          img.src = src;
          img.alt = entry.tags.join(', ');
          img.loading = 'lazy';
          card.appendChild(img);
        }

        const info = document.createElement('div');
        info.className = 'card-info';

        const tagList = document.createElement('div');
        tagList.className = 'tag-list';
        entry.tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = tag;
          tagList.appendChild(span);
        });

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => openEditModal(entry.filename, entry.tags));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => deletePhoto(entry.filename));

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(deleteBtn);

        info.appendChild(tagList);
        info.appendChild(btnGroup);
        card.appendChild(info);
        grid.appendChild(card);
      });

      archiveEl.appendChild(grid);
    }

    function renderListView(items) {
      const table = document.createElement('table');
      table.className = 'archive-table';

      table.innerHTML = `
        <thead>
          <tr>
            <th>Preview</th>
            <th>Filename</th>
            <th>Type</th>
            <th>Tags</th>
            <th>Uploaded</th>
            <th></th>
          </tr>
        </thead>
      `;

      const tbody = document.createElement('tbody');

      items.forEach(entry => {
        const tr = document.createElement('tr');
        tr.dataset.filename = entry.filename;
        const isVideo = entry.mediaType === 'video';
        const src = `/uploads/${entry.filename}`;

        const tdPreview = document.createElement('td');
        if (isVideo) {
          const wrap = document.createElement('div');
          wrap.className = 'list-video-thumb';
          const video = document.createElement('video');
          video.src = src;
          video.muted = true;
          video.preload = 'metadata';
          video.className = 'list-thumbnail';
          wrap.appendChild(video);
          wrap.style.cursor = 'pointer';
          wrap.addEventListener('click', () => window.openVideoOverlay(src));
          tdPreview.appendChild(wrap);
        } else {
          const img = document.createElement('img');
          img.src = src;
          img.alt = entry.tags.join(', ');
          img.className = 'list-thumbnail';
          img.loading = 'lazy';
          tdPreview.appendChild(img);
        }

        const tdName = document.createElement('td');
        tdName.textContent = entry.originalName;

        const tdTags = document.createElement('td');
        const tagList = document.createElement('div');
        tagList.className = 'tag-list';
        entry.tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = tag;
          tagList.appendChild(span);
        });
        tdTags.appendChild(tagList);

        const tdDate = document.createElement('td');
        tdDate.textContent = new Date(entry.uploadedAt).toLocaleDateString();

        const tdAction = document.createElement('td');
        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => openEditModal(entry.filename, entry.tags));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => deletePhoto(entry.filename));

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(deleteBtn);
        tdAction.appendChild(btnGroup);

        const tdType = document.createElement('td');
        tdType.textContent = isVideo ? 'Video' : 'Image';

        tr.appendChild(tdPreview);
        tr.appendChild(tdName);
        tr.appendChild(tdType);
        tr.appendChild(tdTags);
        tr.appendChild(tdDate);
        tr.appendChild(tdAction);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      archiveEl.appendChild(table);
    }

    async function deletePhoto(filename) {
      if (!confirm('Delete this file? This cannot be undone.')) return;

      try {
        const res = await fetch(`/api/delete/${filename}`, { method: 'DELETE' });
        if (res.ok) {
          photos = photos.filter(p => p.filename !== filename);
          render();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to delete photo');
        }
      } catch (err) {
        alert('Network error. Is the server running?');
      }
    }

    // Edit modal
    const editModal = document.getElementById('edit-modal');
    const editFilename = document.getElementById('edit-filename');
    const editTagsInput = document.getElementById('edit-tags');
    const editCancelBtn = document.getElementById('edit-cancel');
    const editSaveBtn = document.getElementById('edit-save');
    const editBackdrop = editModal.querySelector('.edit-modal-backdrop');

    function openEditModal(filename, tags) {
      editFilename.value = filename;
      editTagsInput.value = tags.join(', ');
      editModal.classList.remove('hidden');
      editTagsInput.focus();
    }

    function closeEditModal() {
      editModal.classList.add('hidden');
      editFilename.value = '';
      editTagsInput.value = '';
    }

    async function saveTags() {
      const filename = editFilename.value;
      const tagsString = editTagsInput.value;
      const tags = tagsString.split(',').map(t => t.trim()).filter(Boolean);

      editSaveBtn.disabled = true;
      editSaveBtn.textContent = 'Saving...';

      try {
        const res = await fetch(`/api/tags/${filename}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tags })
        });

        if (res.ok) {
          const data = await res.json();
          const photo = photos.find(p => p.filename === filename);
          if (photo) {
            photo.tags = data.entry.tags;
          }
          closeEditModal();
          render();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to update tags');
        }
      } catch (err) {
        alert('Network error. Is the server running?');
      }

      editSaveBtn.disabled = false;
      editSaveBtn.textContent = 'Save';
    }

    editCancelBtn.addEventListener('click', closeEditModal);
    editSaveBtn.addEventListener('click', saveTags);
    editBackdrop.addEventListener('click', closeEditModal);
    editTagsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveTags();
      } else if (e.key === 'Escape') {
        closeEditModal();
      }
    });

    // View toggle
    btnThumbnail.addEventListener('click', () => {
      viewMode = 'thumbnail';
      btnThumbnail.classList.add('active');
      btnList.classList.remove('active');
      render();
    });

    btnList.addEventListener('click', () => {
      viewMode = 'list';
      btnList.classList.add('active');
      btnThumbnail.classList.remove('active');
      render();
    });

    // Sort change
    sortSelect.addEventListener('change', render);

    // Scroll to highlighted item from query param
    function scrollToHighlighted() {
      const params = new URLSearchParams(window.location.search);
      const highlightFilename = params.get('highlight');
      if (highlightFilename) {
        const element = document.querySelector(`[data-filename="${CSS.escape(highlightFilename)}"]`);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        // Clean up URL
        window.history.replaceState({}, '', window.location.pathname);
      }
    }

    // Initial load
    loadPhotos().then(scrollToHighlighted);
  </script>
</body>
</html>
