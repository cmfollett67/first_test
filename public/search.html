<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Photos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="theme.js"></script>
  <script src="overlay.js"></script>
  <nav>
    <a href="search.html" class="active">Search</a>
    <a href="upload.html">Upload</a>
    <a href="archive.html">Archive</a>
    <div class="theme-toggle">
      <span class="theme-label">Light</span>
      <button id="theme-toggle" class="toggle-switch" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
      <span class="theme-label">Dark</span>
    </div>
  </nav>

  <main>
    <h1>Search Photos</h1>
    <form id="search-form">
      <div class="search-bar">
        <input type="text" id="query" placeholder="Search by tag..." required>
        <button type="button" id="mic-btn" class="mic-btn" title="Voice search" aria-label="Voice search">
          <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button type="submit">Search</button>
      </div>
    </form>

    <div id="results"></div>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const resultsEl = document.getElementById('results');

    // Voice search
    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener('click', () => {
        micBtn.classList.add('listening');
        recognition.start();
      });

      recognition.addEventListener('result', (e) => {
        const transcript = e.results[0][0].transcript.trim();
        queryInput.value = transcript;
        micBtn.classList.remove('listening');
        form.dispatchEvent(new Event('submit'));
      });

      recognition.addEventListener('end', () => {
        micBtn.classList.remove('listening');
      });

      recognition.addEventListener('error', () => {
        micBtn.classList.remove('listening');
      });
    } else {
      micBtn.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      resultsEl.innerHTML = '<p class="loading">Searching...</p>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.results.length === 0) {
          resultsEl.innerHTML = '<p class="no-results">No results found matching your search.</p>';
          return;
        }

        resultsEl.innerHTML = `<p class="result-count">${data.results.length} result${data.results.length !== 1 ? 's' : ''} found</p>`;

        const grid = document.createElement('div');
        grid.className = 'photo-grid';

        data.results.forEach(entry => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          const isVideo = entry.mediaType === 'video';
          const src = `/uploads/${entry.filename}`;

          if (isVideo) {
            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'video-thumb';

            const video = document.createElement('video');
            video.src = src;
            video.muted = true;
            video.preload = 'metadata';

            const playIcon = document.createElement('div');
            playIcon.className = 'play-icon';
            playIcon.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

            thumbWrap.appendChild(video);
            thumbWrap.appendChild(playIcon);
            thumbWrap.addEventListener('click', () => window.openVideoOverlay(src));
            card.appendChild(thumbWrap);
          } else {
            const img = document.createElement('img');
            img.src = src;
            img.alt = entry.tags.join(', ');
            img.loading = 'lazy';
            card.appendChild(img);
          }

          const tagList = document.createElement('div');
          tagList.className = 'tag-list';
          entry.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            tagList.appendChild(span);
          });

          card.appendChild(tagList);
          grid.appendChild(card);
        });

        resultsEl.appendChild(grid);
      } catch (err) {
        resultsEl.innerHTML = '<p class="error">Network error. Is the server running?</p>';
      }
    });
  </script>
</body>
</html>
