<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Photos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="theme.js"></script>
  <script src="overlay.js"></script>
  <nav>
    <a href="search.html" class="active">Search</a>
    <a href="upload.html">Upload</a>
    <a href="archive.html">Archive</a>
    <div class="theme-toggle">
      <span class="theme-label">Light</span>
      <button id="theme-toggle" class="toggle-switch" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
      <span class="theme-label">Dark</span>
    </div>
  </nav>

  <main>
    <!-- Preview Carousel -->
    <div id="preview-carousel" class="preview-carousel">
      <div class="carousel-container">
        <div id="carousel-items" class="carousel-items"></div>
        <div class="carousel-overlay">
          <div id="carousel-tags" class="carousel-tags"></div>
        </div>
        <div id="carousel-paused" class="carousel-paused hidden">Paused</div>
      </div>
      <div id="carousel-dots" class="carousel-dots"></div>
    </div>

    <h1>Search Photos</h1>
    <form id="search-form">
      <div class="search-bar">
        <input type="text" id="query" placeholder="Search by tag..." required>
        <button type="button" id="mic-btn" class="mic-btn" title="Voice search" aria-label="Voice search">
          <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button type="submit">Search</button>
      </div>
    </form>

    <div id="results"></div>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const resultsEl = document.getElementById('results');

    // Voice search
    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener('click', () => {
        micBtn.classList.add('listening');
        recognition.start();
      });

      recognition.addEventListener('result', (e) => {
        const transcript = e.results[0][0].transcript.trim();
        queryInput.value = transcript;
        micBtn.classList.remove('listening');
        form.dispatchEvent(new Event('submit'));
      });

      recognition.addEventListener('end', () => {
        micBtn.classList.remove('listening');
      });

      recognition.addEventListener('error', () => {
        micBtn.classList.remove('listening');
      });
    } else {
      micBtn.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      resultsEl.innerHTML = '<p class="loading">Searching...</p>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.results.length === 0) {
          resultsEl.innerHTML = '<p class="no-results">No results found matching your search.</p>';
          return;
        }

        resultsEl.innerHTML = `<p class="result-count">${data.results.length} result${data.results.length !== 1 ? 's' : ''} found</p>`;

        const grid = document.createElement('div');
        grid.className = 'photo-grid';

        data.results.forEach(entry => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          const isVideo = entry.mediaType === 'video';
          const src = `/uploads/${entry.filename}`;

          if (isVideo) {
            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'video-thumb';

            const video = document.createElement('video');
            video.src = src;
            video.muted = true;
            video.preload = 'metadata';

            const playIcon = document.createElement('div');
            playIcon.className = 'play-icon';
            playIcon.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

            thumbWrap.appendChild(video);
            thumbWrap.appendChild(playIcon);
            thumbWrap.addEventListener('click', () => window.openVideoOverlay(src));
            card.appendChild(thumbWrap);
          } else {
            const img = document.createElement('img');
            img.src = src;
            img.alt = entry.tags.join(', ');
            img.loading = 'lazy';
            card.appendChild(img);
          }

          const tagList = document.createElement('div');
          tagList.className = 'tag-list';
          entry.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            tagList.appendChild(span);
          });

          card.appendChild(tagList);
          grid.appendChild(card);
        });

        resultsEl.appendChild(grid);
      } catch (err) {
        resultsEl.innerHTML = '<p class="error">Network error. Is the server running?</p>';
      }
    });

    // Preview Carousel
    const carouselEl = document.getElementById('preview-carousel');
    const carouselItems = document.getElementById('carousel-items');
    const carouselTags = document.getElementById('carousel-tags');
    const carouselDots = document.getElementById('carousel-dots');
    const carouselPaused = document.getElementById('carousel-paused');

    let previewItems = [];
    let currentIndex = 0;
    let carouselInterval = null;
    let isPaused = false;

    async function loadPreviewItems() {
      try {
        const res = await fetch('/api/all');
        const data = await res.json();
        // Sort by newest and take top 10
        previewItems = data.results
          .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt))
          .slice(0, 10);

        if (previewItems.length === 0) {
          carouselEl.classList.add('hidden');
          return;
        }

        renderCarouselItems();
        renderDots();
        showSlide(0);
        startCarousel();
      } catch (err) {
        carouselEl.classList.add('hidden');
      }
    }

    function renderCarouselItems() {
      carouselItems.innerHTML = '';
      previewItems.forEach((entry, index) => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        slide.dataset.index = index;

        const isVideo = entry.mediaType === 'video';
        const src = `/uploads/${entry.filename}`;

        if (isVideo) {
          const video = document.createElement('video');
          video.src = src;
          video.muted = true;
          video.preload = 'metadata';
          slide.appendChild(video);

          const playIcon = document.createElement('div');
          playIcon.className = 'carousel-play-icon';
          playIcon.innerHTML = '<svg viewBox="0 0 24 24" width="48" height="48" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
          slide.appendChild(playIcon);
        } else {
          const img = document.createElement('img');
          img.src = src;
          img.alt = entry.tags.join(', ');
          slide.appendChild(img);
        }

        slide.addEventListener('click', () => {
          if (isVideo) {
            window.openVideoOverlay(src);
          }
        });

        carouselItems.appendChild(slide);
      });
    }

    function renderDots() {
      carouselDots.innerHTML = '';
      previewItems.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = 'carousel-dot';
        dot.setAttribute('aria-label', `Go to slide ${index + 1}`);
        dot.addEventListener('click', () => {
          showSlide(index);
          resetCarousel();
        });
        carouselDots.appendChild(dot);
      });
    }

    function showSlide(index) {
      currentIndex = index;
      const slides = carouselItems.querySelectorAll('.carousel-slide');
      const dots = carouselDots.querySelectorAll('.carousel-dot');

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      // Update tags display
      const entry = previewItems[index];
      carouselTags.innerHTML = '';
      entry.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        carouselTags.appendChild(span);
      });
    }

    function nextSlide() {
      const next = (currentIndex + 1) % previewItems.length;
      showSlide(next);
    }

    function startCarousel() {
      if (carouselInterval) clearInterval(carouselInterval);
      carouselInterval = setInterval(() => {
        if (!isPaused) nextSlide();
      }, 1500);
    }

    function resetCarousel() {
      startCarousel();
    }

    function togglePause() {
      isPaused = !isPaused;
      carouselPaused.classList.toggle('hidden', !isPaused);
    }

    // Pause on hover
    carouselEl.addEventListener('mouseenter', () => {
      if (!isPaused) {
        isPaused = true;
        carouselPaused.classList.remove('hidden');
      }
    });

    carouselEl.addEventListener('mouseleave', () => {
      isPaused = false;
      carouselPaused.classList.add('hidden');
    });

    // Load preview items on page load
    loadPreviewItems();
  </script>
</body>
</html>
