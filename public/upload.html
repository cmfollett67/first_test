<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="theme.js"></script>
  <nav>
    <a href="search.html">Search</a>
    <a href="upload.html" class="active">Upload</a>
    <a href="archive.html">Archive</a>
    <div class="theme-toggle">
      <span class="theme-label">Light</span>
      <button id="theme-toggle" class="toggle-switch" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
      <span class="theme-label">Dark</span>
    </div>
  </nav>

  <main>
    <h1>Upload a Photo or Video</h1>
    <form id="upload-form">
      <div class="form-group">
        <label for="photo">Select a .png or .mp4 file</label>
        <input type="file" id="photo" name="photo" accept=".png,.mp4" required>
      </div>

      <div id="preview-container" class="hidden">
        <img id="preview-img" alt="Image preview">
        <video id="preview-video" controls></video>
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" name="tags" placeholder="e.g. sunset, beach, vacation">
      </div>

      <button type="submit" id="submit-btn">Upload</button>
    </form>

    <div id="message" class="hidden"></div>
  </main>

  <script>
    const photoInput = document.getElementById('photo');
    const previewImg = document.getElementById('preview-img');
    const previewVideo = document.getElementById('preview-video');
    const previewContainer = document.getElementById('preview-container');
    const form = document.getElementById('upload-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      previewImg.classList.add('hidden');
      previewVideo.classList.add('hidden');

      if (file) {
        const url = URL.createObjectURL(file);
        if (file.type === 'video/mp4') {
          previewVideo.src = url;
          previewVideo.classList.remove('hidden');
        } else {
          previewImg.src = url;
          previewImg.classList.remove('hidden');
        }
        previewContainer.classList.remove('hidden');
      } else {
        previewContainer.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('photo', photoInput.files[0]);
      formData.append('tags', document.getElementById('tags').value);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          messageEl.textContent = 'File uploaded successfully!';
          messageEl.className = 'message success';
          form.reset();
          previewContainer.classList.add('hidden');
        } else {
          messageEl.textContent = data.error || 'Upload failed';
          messageEl.className = 'message error';
        }
      } catch (err) {
        messageEl.textContent = 'Network error. Is the server running?';
        messageEl.className = 'message error';
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Upload';
      messageEl.classList.remove('hidden');
    });
  </script>
</body>
</html>
